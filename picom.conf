# Rounded corners
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Animations
animations = ({
  triggers = ["geometry"];
  preset = "geometry-change";
  duration = 0.08;
});

# Shadows
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.75;
shadow-offset-x = -7;
shadow-offset-y = -7;

# Fading
# fading = false;
# fade-in-step = 0.03;
# fade-out-step = 0.03;
# fade-delta = 3;

# Transparency/Opacity
inactive-opacity = 0.90;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Blur
blur-method = "kernel";
blur-kern = "3x3box";
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Backend
backend = "glx";
vsync = true;
experimental-backends = true;

# Other
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
